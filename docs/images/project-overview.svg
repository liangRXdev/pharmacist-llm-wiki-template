<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pharmacist LLM Wiki Template 專案資訊總表</title>
  <desc id="desc">16:9 橫式資訊圖，說明臨床藥師 LLM Wiki Template 的工作流程、產出、EBM 規格與風險控管。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1f2937"/></marker>
    <style><![CDATA[
      .bg{fill:#f7fbff}.paper{fill:white;stroke:#d6e2f0;stroke-width:2}.card{fill:white;stroke:#a9bfd8;stroke-width:2}.soft{fill:#f3f8ff}.tealbox{fill:#e9fbfb;stroke:#0f8f94;stroke-width:2}.bluebox{fill:#eef5ff;stroke:#1769aa;stroke-width:2}.purplebox{fill:#f4f1ff;stroke:#5b4ba3;stroke-width:2}.warnbox{fill:#fff8e8;stroke:#f59e0b;stroke-width:2}.redbox{fill:#fff2f2;stroke:#e35d5b;stroke-width:2}.navy{fill:#062b63}.teal{fill:#0f8f94}.blue{fill:#1769aa}.purple{fill:#5b4ba3}.red{fill:#b42318}.muted{fill:#4b5563}.title{font:800 62px Arial,'Microsoft JhengHei','Noto Sans TC',sans-serif}.subtitle{font:800 36px 'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}.desc{font:500 22px 'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}.h{font:800 27px 'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}.body{font:500 20px 'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}.small{font:500 17px 'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}.mono{font:600 18px Consolas,'Noto Sans Mono',monospace}.tag{fill:#062b63}.tagtext{fill:#fff;font:800 24px Arial,'Microsoft JhengHei',sans-serif}.arrow{stroke:#1f2937;stroke-width:5;marker-end:url(#arrow)}.dash{stroke:#c8d5e5;stroke-width:2;stroke-dasharray:6 6}.check{fill:#0f8f94}.icon{font:700 34px 'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}
    ]]></style>
  </defs>

  <rect width="1600" height="900" rx="18" class="bg"/>
  <rect x="12" y="12" width="1576" height="876" rx="18" class="paper"/>

  <!-- Header -->
  <g transform="translate(36,30)">
    <circle cx="48" cy="52" r="34" fill="#e9fbfb" stroke="#0f8f94" stroke-width="4"/>
    <path d="M30 60 L66 24" stroke="#062b63" stroke-width="8" stroke-linecap="round"/>
    <circle cx="80" cy="72" r="24" fill="#062b63"/><text x="80" y="82" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">+</text>
    <text x="135" y="50" class="title navy">Pharmacist LLM Wiki Template</text>
    <text x="138" y="98" class="subtitle teal">臨床藥師用的 AI 實證知識庫工作流程模板</text>
    <text x="138" y="135" class="desc">用 Claude Code / LLM Agent + Obsidian，將文獻整理成可查詢、可稽核、可健檢的個人藥學知識庫</text>
  </g>

  <!-- A -->
  <rect x="28" y="180" width="390" height="300" rx="14" class="card"/>
  <rect x="45" y="198" width="40" height="40" rx="8" class="tag"/><text x="65" y="226" text-anchor="middle" class="tagtext">1</text>
  <text x="100" y="228" class="h navy">A. 這個專案是什麼？</text>
  <text x="65" y="292" class="icon blue">◆</text><text x="105" y="290" class="body">提供方法與骨架，不含臨床內容</text>
  <text x="65" y="365" class="icon blue">▣</text><text x="105" y="353" class="body">以 Markdown Wiki 建立</text><text x="105" y="382" class="body">個人 EBM 知識庫</text>
  <text x="65" y="438" class="icon blue">↔</text><text x="105" y="426" class="body">讓 LLM 協助整理文獻、</text><text x="105" y="455" class="body">維護連結與索引</text>

  <!-- B workflow -->
  <rect x="432" y="180" width="670" height="300" rx="14" class="card"/>
  <rect x="452" y="198" width="40" height="40" rx="8" class="tag"/><text x="472" y="226" text-anchor="middle" class="tagtext">2</text>
  <text x="508" y="228" class="h navy">B. 核心工作流程</text>
  <g transform="translate(458,260)">
    <rect width="110" height="118" rx="12" fill="#fff" stroke="#a9bfd8" stroke-width="2"/>
    <text x="55" y="35" text-anchor="middle" class="small">raw /</text><text x="55" y="63" text-anchor="middle" class="small">PDF 文獻</text><rect x="35" y="76" width="40" height="30" fill="#ef4444" rx="4"/><text x="55" y="97" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">PDF</text>
    <line x1="118" y1="59" x2="152" y2="59" class="arrow"/>
    <rect x="160" width="130" height="118" rx="12" class="tealbox"/><text x="225" y="36" text-anchor="middle" class="small">Claude Code /</text><text x="225" y="64" text-anchor="middle" class="small">LLM Agent</text><circle cx="225" cy="92" r="20" fill="#0f8f94"/><path d="M215 92 h20 M225 82 v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="300" y1="59" x2="334" y2="59" class="arrow"/>
    <rect x="342" width="130" height="118" rx="12" class="tealbox"/><text x="407" y="30" text-anchor="middle" class="small">source /</text><text x="407" y="55" text-anchor="middle" class="small">entity / concept</text><text x="407" y="82" text-anchor="middle" class="small">頁面</text><text x="407" y="108" text-anchor="middle" class="icon teal">▤</text>
    <line x1="482" y1="59" x2="516" y2="59" class="arrow"/>
    <rect x="524" width="120" height="118" rx="12" class="bluebox"/><text x="584" y="40" text-anchor="middle" class="small">index.md /</text><text x="584" y="68" text-anchor="middle" class="small">log.md</text><text x="584" y="104" text-anchor="middle" class="icon blue">▣</text>
    <line x1="654" y1="59" x2="688" y2="59" class="arrow"/>
    <rect x="696" width="110" height="118" rx="12" class="purplebox"/><text x="751" y="42" text-anchor="middle" class="small">Query /</text><text x="751" y="70" text-anchor="middle" class="small">Lint</text><text x="751" y="105" text-anchor="middle" class="icon purple">⌕</text>
  </g>
  <rect x="465" y="408" width="600" height="48" rx="10" fill="#fff" stroke="#c8d5e5" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="535" y="439" class="body teal">Ingest：建頁</text><text x="720" y="439" class="body blue">Query：查詢</text><text x="895" y="439" class="body purple">Lint：健檢</text>

  <!-- C output -->
  <rect x="1116" y="180" width="456" height="300" rx="14" class="card"/>
  <rect x="1134" y="198" width="40" height="40" rx="8" class="tag"/><text x="1154" y="226" text-anchor="middle" class="tagtext">3</text>
  <text x="1190" y="228" class="h navy">C. 產出內容</text>
  <g transform="translate(1152,275)" class="body">
    <text y="0">📁  raw/：原始文獻 PDF</text><line x1="0" y1="22" x2="385" y2="22" class="dash"/>
    <text y="48">📄  wiki/source-*.md：單篇文獻摘要</text><line x1="0" y1="70" x2="385" y2="70" class="dash"/>
    <text y="96">🔗  wiki/entity-*.md：藥物 / 疾病連結節點</text><line x1="0" y1="118" x2="385" y2="118" class="dash"/>
    <text y="144">💡  wiki/concept-*.md：概念 / 機制頁</text><line x1="0" y1="166" x2="385" y2="166" class="dash"/>
    <text y="192">📋  wiki/index.md：全庫目錄</text><line x1="0" y1="214" x2="385" y2="214" class="dash"/>
    <text y="240">🗒  wiki/log.md：異動日誌</text>
  </g>

  <!-- D EBM -->
  <rect x="28" y="495" width="390" height="280" rx="14" class="card"/>
  <rect x="45" y="512" width="40" height="40" rx="8" class="tag"/><text x="65" y="540" text-anchor="middle" class="tagtext">4</text>
  <text x="100" y="542" class="h navy">D. EBM 規格重點</text>
  <rect x="48" y="585" width="170" height="160" rx="10" class="tealbox"/><rect x="48" y="585" width="170" height="38" rx="10" fill="#0f8f94"/><text x="133" y="611" text-anchor="middle" fill="#fff" class="small">研究型文獻</text>
  <text x="62" y="648" class="small">✓ Study design</text><text x="62" y="673" class="small">✓ PICO</text><text x="62" y="698" class="small">✓ effect size + 95% CI</text><text x="62" y="723" class="small">✓ RoB / GRADE</text>
  <rect x="232" y="585" width="165" height="160" rx="10" class="bluebox"/><rect x="232" y="585" width="165" height="38" rx="10" fill="#1769aa"/><text x="315" y="604" text-anchor="middle" fill="#fff" class="small">Guideline /</text><text x="315" y="624" text-anchor="middle" fill="#fff" class="small">narrative review 類</text>
  <text x="246" y="648" class="small">✓ 來源型別 + 年份</text><text x="246" y="673" class="small">✓ Applicability</text><text x="246" y="698" class="small">✓ Bottom line</text><text x="246" y="723" class="small">✓ 不強制 PICO / RoB</text>

  <!-- E quality risk -->
  <rect x="432" y="495" width="670" height="280" rx="14" class="card"/>
  <rect x="452" y="512" width="40" height="40" rx="8" class="tag"/><text x="472" y="540" text-anchor="middle" class="tagtext">5</text>
  <text x="508" y="542" class="h navy">E. 工程與風險控管</text>
  <line x1="767" y1="570" x2="767" y2="750" stroke="#c8d5e5" stroke-width="2"/>
  <g transform="translate(465,595)" class="small">
    <text y="0">⚙ wiki_lint.py：壞鏈、孤立頁、frontmatter、過期頁、EBM 欄位檢查</text>
    <text y="36">🧪 pytest 回歸測試</text>
    <text y="72">✓ GitHub Actions CI</text>
    <text y="108">⌁ source_hash 過期偵測</text>
    <text y="144">{} JSON 摘要模式避免外洩內容</text>
  </g>
  <g transform="translate(790,595)" class="small">
    <text y="0">⚠ 不可公開散布 ingest 後的 wiki 內容</text>
    <text y="45">⚠ LLM 摘要可能出錯，臨床使用前必須回核原始來源</text>
    <text y="90">⚠ entity 頁不是 drug monograph</text>
    <text y="135">⚠ 內建個資掃描：身分證 / 手機 / Email</text>
  </g>

  <!-- F -->
  <rect x="1116" y="495" width="456" height="280" rx="14" class="card"/>
  <rect x="1134" y="512" width="40" height="40" rx="8" class="tag"/><text x="1154" y="540" text-anchor="middle" class="tagtext">6</text>
  <text x="1190" y="542" class="h navy">F. 適合誰？ / 不是什麼？</text>
  <rect x="1140" y="580" width="190" height="165" rx="10" fill="#effaf8" stroke="#0f8f94" stroke-width="2"/><text x="1235" y="612" text-anchor="middle" class="h" fill="#0f8f94">適合誰？</text>
  <text x="1160" y="652" class="small">✓ AI 進階臨床藥師</text><text x="1160" y="688" class="small">✓ EBM / DI / 教學型藥師</text><text x="1160" y="724" class="small">✓ 想用 LLM 建立知識庫</text>
  <rect x="1345" y="580" width="205" height="165" rx="10" class="redbox"/><text x="1448" y="612" text-anchor="middle" class="h red">不是什麼？</text>
  <text x="1365" y="652" class="small">✕ 不是 Web App</text><text x="1365" y="688" class="small">✕ 不是公開藥學 Wiki</text><text x="1365" y="724" class="small">✕ 不是臨床決策支援系統</text>

  <!-- footer -->
  <rect x="28" y="800" width="1544" height="70" rx="14" fill="#062b63"/>
  <text x="70" y="846" font-size="38">💡</text>
  <text x="125" y="846" fill="#fff" class="h">一句話總結：這是一套幫臨床藥師把文獻整理成「</text>
  <text x="830" y="846" fill="#ffd54a" class="h">可追溯、可更新、可查詢</text>
  <text x="1155" y="846" fill="#fff" class="h">」知識庫的工作流程模板。</text>
</svg>
